_format_version: '3.0'
_transform: true

services:
  - name: api
    url: http://api:8000
    routes:
      - name: api-v1
        paths:
          - /api/v1
        strip_path: false
      - name: media
        paths:
          - /media
        strip_path: false

plugins:
  - name: rate-limiting
    service: api
    config:
      minute: 100
      policy: local
      limit_by: ip
  - name: file-log
    service: api
    config:
      path: /dev/stdout
  - name: cors
    service: api
    config:
      origins:
        - http://localhost:3000
        - http://localhost:3001
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Length
      credentials: true
      max_age: 3600
