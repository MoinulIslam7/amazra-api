services:
  postgres:
    image: postgres:16
    container_name: amazra-postgres
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: pgbouncer/pgbouncer:1.15.0
    container_name: amazra-pgbouncer
    depends_on:
      - postgres
    ports:
      - '6432:6432'
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER:-postgres}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASES_DBNAME: ${POSTGRES_DB:-amazra}
      PGBOUNCER_LISTEN_PORT: 6432
      PGBOUNCER_AUTH_TYPE: plain
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    volumes:
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

  redis:
    image: redis:7
    container_name: amazra-redis
    ports:
      - '6380:6379'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: amazra-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - '9201:9200'
    volumes:
      - es_data:/usr/share/elasticsearch/data

  elasticsearch-init:
    image: curlimages/curl:8.6.0
    depends_on:
      - elasticsearch
    volumes:
      - ./infra/elasticsearch:/setup:ro
    entrypoint: ['sh', '/setup/setup.sh']

  rabbitmq:
    image: rabbitmq:3-management
    container_name: amazra-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: amazra-api
    env_file:
      - .env
    environment:
      # ── Infrastructure (container-internal hostnames override .env) ──────────
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-amazra}
      DATABASE_POOL_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-amazra}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # ── Phase 4: Payment gateways (forwarded from .env; empty = disabled) ────
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASS: ${SSLCOMMERZ_STORE_PASS:-}
      SSLCOMMERZ_IS_SANDBOX: ${SSLCOMMERZ_IS_SANDBOX:-true}
      BKASH_BASE_URL: ${BKASH_BASE_URL:-https://tokenized.sandbox.bka.sh/v1.2.0-beta}
      BKASH_USERNAME: ${BKASH_USERNAME:-}
      BKASH_PASSWORD: ${BKASH_PASSWORD:-}
      BKASH_APP_KEY: ${BKASH_APP_KEY:-}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET:-}
      NAGAD_BASE_URL: ${NAGAD_BASE_URL:-https://sandbox.mynagad.com:10080/remote-payment-gateway-1.0}
      NAGAD_MERCHANT_ID: ${NAGAD_MERCHANT_ID:-}
      NAGAD_MERCHANT_PRIVATE_KEY: ${NAGAD_MERCHANT_PRIVATE_KEY:-}
      NAGAD_PUBLIC_KEY: ${NAGAD_PUBLIC_KEY:-}
      COD_MAX_ORDER_AMOUNT: ${COD_MAX_ORDER_AMOUNT:-50000}
      PAYMENT_CONFIRMED_QUEUE_NAME: ${PAYMENT_CONFIRMED_QUEUE_NAME:-payment_confirmed}
      PAYMENT_FAILED_QUEUE_NAME: ${PAYMENT_FAILED_QUEUE_NAME:-payment_failed}
      # ── Phase 5: Delivery (forwarded from .env; empty = disabled) ────────────
      PATHAO_BASE_URL: ${PATHAO_BASE_URL:-https://hermes.pathao.com}
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID:-}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET:-}
      PATHAO_USERNAME: ${PATHAO_USERNAME:-}
      PATHAO_PASSWORD: ${PATHAO_PASSWORD:-}
      PATHAO_STORE_ID: ${PATHAO_STORE_ID:-}
      PATHAO_DEFAULT_CITY_ID: ${PATHAO_DEFAULT_CITY_ID:-1}
      PATHAO_DEFAULT_ZONE_ID: ${PATHAO_DEFAULT_ZONE_ID:-1}
      STEADFAST_BASE_URL: ${STEADFAST_BASE_URL:-https://portal.steadfast.com.bd/public/v1}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY:-}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY:-}
      # ── Phase 5: Notifications (forwarded from .env; empty = disabled) ───────
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      GENERIC_SMS_URL: ${GENERIC_SMS_URL:-}
      GENERIC_SMS_API_KEY: ${GENERIC_SMS_API_KEY:-}
      GENERIC_SMS_SENDER_ID: ${GENERIC_SMS_SENDER_ID:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Amazra}
      NOTIFICATION_EVENTS_QUEUE_NAME: ${NOTIFICATION_EVENTS_QUEUE_NAME:-notification_events}
    depends_on:
      - postgres
      - pgbouncer
      - redis
      - elasticsearch
      - rabbitmq
    ports:
      - '8001:8000'

  kong:
    image: kong:3.6
    container_name: amazra-kong
    depends_on:
      - api
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - '8000:8000'
      - '8002:8001'
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro

volumes:
  postgres_data:
  es_data:
